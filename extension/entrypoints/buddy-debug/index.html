<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hatch buddy debug</title>
    <style>
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #1d1915; color: #f6eedc; }
      header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      header strong { margin-right: 8px; }
      button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #8a8178; background: #120e0b; color: #f6eedc; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #f2a93b; color: #f2a93b; }
      .stages { display: grid; grid-template-columns: 1fr 1fr; }
      .stage { min-height: 420px; display: flex; gap: 48px; align-items: center; justify-content: center; position: relative; }
      .stage.dark { background: #0d0a08; }
      .stage.light { background: #f4efe4; color: #120e0b; }
      .stage figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
      .slot { position: relative; display: grid; place-items: center; }
      .slot canvas { position: absolute; left: -25%; top: -25%; width: 150%; height: 150%; }
      .badge { position: absolute; top: 1px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #f2a93b; color: #120e0b; font-size: 11px; font-weight: 800; display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #120e0b; }
      .badge.on { display: flex; }
      #fps { font-variant-numeric: tabular-nums; margin-left: auto; color: #f2a93b; }
      .sep { width: 1px; height: 24px; background: #8a8178; margin: 0 4px; }
    </style>
  </head>
  <body>
    <header id="controls">
      <strong>Hatch buddy</strong>
      <button data-state="idle">idle</button>
      <button data-state="noticed">noticed</button>
      <button data-state="thinking">thinking</button>
      <button data-state="ready">ready</button>
      <button data-action="hatch">launched / hatched</button>
      <span class="sep"></span>
      <button data-action="badge-up">badge +1</button>
      <button data-action="badge-down">badge −1</button>
      <span class="sep"></span>
      <button data-sound="chirp">♪ chirp (40%)</button>
      <button data-sound="chirpDouble">♪♪ double chirp</button>
      <span class="sep"></span>
      <button data-action="reduced" aria-pressed="false">reduced motion</button>
      <span id="sound" style="color:#8a8178">no sound yet</span>
      <span id="fps">– fps</span>
    </header>
    <div class="stages">
      <section class="stage dark" id="dark"></section>
      <section class="stage light" id="light"></section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
