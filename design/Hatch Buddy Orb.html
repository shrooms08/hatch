  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

(18, 14, 11, 0.09);\n\n  --input-bg: var(--shell-0);\n  --input-border: rgba(18, 14, 11, 0.16);\n  --input-border-hover: rgba(18, 14, 11, 0.28);\n  --focus-ring: 0 0 0 3px rgba(219, 146, 39, 0.35);\n\n  --success: var(--sprout-700);\n  --success-bg: rgba(78, 122, 44, 0.12);\n  --warning: var(--honey-700);\n  --warning-bg: rgba(138, 106, 18, 0.12);\n  --error: var(--radish-700);\n  --error-bg: rgba(176, 42, 61, 0.10);\n\n  --status-incubating: var(--ash-700);\n  --status-incubating-bg: rgba(18, 14, 11, 0.07);\n  --status-almost: var(--yolk-700);\n  --status-almost-bg: rgba(242, 169, 59, 0.22);\n  --status-hatched: var(--ember-700);\n  --status-hatched-bg: rgba(232, 87, 42, 0.14);\n  --track: var(--shell-200);\n}\n\n:root {\n  --font-display: 'Rubik', ui-rounded, system-ui, sans-serif;\n  --font-ui: 'Figtree', system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-black: 800;\n\n  /* Display (Rubik) */\n  --text-display-xl: 64px;  --leading-display-xl: 1.0;\n  --text-display-l: 48px;   --leading-display-l: 1.05;\n  --text-h1: 32px;          --leading-h1: 1.1;\n  --text-h2: 24px;          --leading-h2: 1.2;\n  --text-h3: 18px;          --leading-h3: 1.3;\n  --tracking-display: -0.02em;\n\n  /* UI (Figtree) */\n  --text-body-l: 16px;  --leading-body-l: 1.5;\n  --text-body: 14px;    --leading-body: 1.5;\n  --text-sm: 13px;      --leading-sm: 1.45;\n  --text-xs: 12px;      --leading-xs: 1.4;\n  --text-label: 11px;   --tracking-label: 0.06em;\n\n  /* Mono (JetBrains Mono) */\n  --text-mono: 13px;\n  --text-mono-sm: 12px;\n  --mono-features: \"tnum\" 1, \"zero\" 1;\n  --subscript-scale: 0.68em;\n  --subscript-offset: -0.28em;\n}\n\n:root {\n  /* Spacing (4px base) */\n  --space-0: 0;\n  --space-0-5: 2px;\n  --space-1: 4px;\n  --space-1-5: 6px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n\n  /* Radius */\n  --radius-xs: 6px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 20px;\n  --radius-2xl: 28px;\n  --radius-pill: 999px;\n  --radius-egg: 50% 50% 50% 50% / 58% 58% 42% 42%;\n\n  /* Control heights */\n  --control-sm: 32px;\n  --control-md: 40px;\n  --control-lg: 48px;\n  --panel-width: 400px;\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n  --dur-fast: 120ms;\n  --dur-base: 200ms;\n  --dur-slow: 360ms;\n  --dur-hatch: 640ms;\n}\n\n:root {\n  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.40);\n  --shadow-2: 0 1px 2px rgba(0, 0, 0, 0.30), 0 4px 12px rgba(0, 0, 0, 0.35);\n  --shadow-3: 0 2px 6px rgba(0, 0, 0, 0.30), 0 12px 32px rgba(0, 0, 0, 0.45);\n  --shadow-4: 0 4px 12px rgba(0, 0, 0, 0.35), 0 24px 64px rgba(0, 0, 0, 0.55);\n  --shadow-inset: inset 0 1px 0 rgba(255, 245, 225, 0.06);\n  --glow-yolk: 0 0 0 1px rgba(242, 169, 59, 0.30), 0 8px 24px rgba(242, 169, 59, 0.22);\n  --glow-ember: 0 0 0 1px rgba(232, 87, 42, 0.35), 0 8px 28px rgba(232, 87, 42, 0.30);\n}\n[data-theme=\"light\"] {\n  --shadow-1: 0 1px 2px rgba(60, 38, 18, 0.10);\n  --shadow-2: 0 1px 2px rgba(60, 38, 18, 0.08), 0 4px 12px rgba(60, 38, 18, 0.10);\n  --shadow-3: 0 2px 6px rgba(60, 38, 18, 0.08), 0 12px 32px rgba(60, 38, 18, 0.14);\n  --shadow-4: 0 4px 12px rgba(60, 38, 18, 0.10), 0 24px 64px rgba(60, 38, 18, 0.20);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.7);\n}\n\nhtml, body { margin: 0; background: var(--bg); color: var(--text-1); font-family: var(--font-ui); font-size: var(--text-body); line-height: var(--leading-body); -webkit-font-smoothing: antialiased; }\na { color: var(--text-accent); text-decoration: none; }\na:hover { color: var(--accent-hover); text-decoration: underline; }\n.num { font-family: var(--font-mono); font-feature-settings: var(--mono-features); }\n.num sub { ced }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width:250px;padding:14px 16px;border-radius:18px 18px 4px 18px;background:#231C17;color:#F6EEDC;box-shadow:var(--shadow-3);display:flex;flex-direction:column;gap:12px;border:1px solid rgba(246,238,220,0.08)\">\n          <span style=\"font-size:15px;line-height:1.45\">This is about <span style=\"font-family:var(--font-mono);color:#F2A93B\">NVIDIA<\u002Fspan>. Hatch a coin?<\u002Fspan>\n          <div style=\"display:flex;gap:6px\"><button sc-camel-on-click=\"{{ hatchIt }}\" style=\"height:34px;padding:0 14px;border:0;border-radius:999px;background:#F2A93B;color:#120E0B;font-family:var(--font-ui);font-weight:700;font-size:13px;cursor:pointer\" style-hover=\"background:#F5B856\">Hatch it<\u002Fbutton><button sc-camel-on-click=\"{{ toIdle }}\" style=\"height:34px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#F6EEDC;font-family:var(--font-ui);font-weight:600;font-size:13px;cursor:pointer\" style-hover=\"background:rgba(246,238,220,0.06)\">Not now<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showThinking }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width:250px;padding:14px 16px;border-radius:18px 18px 4px 18px;background:#231C17;color:#F6EEDC;box-shadow:var(--shadow-3);display:flex;flex-direction:column;gap:12px;border:1px solid rgba(246,238,220,0.08)\">\n          <span style=\"font-size:15px;line-height:1.45\">Drafting <span style=\"font-family:var(--font-mono);color:#F2A93B\">$JACKET<\u002Fspan>, paired with NVDAx…<\u002Fspan>\n          <div style=\"display:flex;gap:6px\"><button sc-camel-on-click=\"{{ launch }}\" style=\"height:34px;padding:0 14px;border:0;border-radius:999px;background:#F2A93B;color:#120E0B;font-family:var(--font-ui);font-weight:700;font-size:13px;cursor:pointer\" style-hover=\"background:#F5B856\">Launch<\u002Fbutton><button sc-camel-on-click=\"{{ toIdle }}\" style=\"height:34px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#F6EEDC;font-family:var(--font-ui);font-weight:600;font-size:13px;cursor:pointer\">Cancel<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <canvas ref=\"{{ bigRef }}\" style=\"flex-shrink:0;width:440px;height:440px\"><\u002Fcanvas>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n    <div style=\"background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-2)\">States<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <sc-for list=\"{{ stateButtons }}\" as=\"b\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ b.onClick }}\" style=\"display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 14px;border-radius:var(--radius-md);border:1px solid {{ b.border }};background:{{ b.bg }};color:var(--text-1);font-family:var(--font-ui);text-align:left;cursor:pointer\" style-hover=\"border-color:var(--border-2)\">\n            <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-2);width:14px\">{{ b.n }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font-weight:700;font-size:14px\">{{ b.label }}<\u002Fspan><span style=\"font-size:12px;color:var(--text-2);line-height:1.35\">{{ b.desc }}<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-2)\">Tracking<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <span style=\"font-size:13px;flex:1\">Incubating tokens<\u002Fspan>\n        <button sc-camel-on-click=\"{{ badgeDown }}\" style=\"width:36px;height:36px;border-radius:999px;border:1px solid var(--border-2);background:var(--secondary-bg);color:var(--text-1);font-size:18px;cursor:pointer\">−<\u002Fbutton>\n        <span style=\"font-family:var(--font-mono);font-size:15px;width:24px;text-align:center\">{{ badge }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ badgeUp }}\" style=\"width:36px;height:36px;border-radius:999px;border:1px solid var(--border-2);background:var(--secondary-bg);color:var(--text-1);font-size:18px;cursor:pointer\">+<\u002Fbutton>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ hatchOnChain }}\" style=\"height:44px;border:0;border-radius:999px;background:var(--ember);color:var(--on-ember);font-family:var(--font-ui);font-weight:700;font-size:14px;cursor:pointer;opacity:{{ hatchOpacity }}\" style-hover=\"background:var(--ember-hover)\">A token hatched on-chain<\u002Fbutton>\n      <label style=\"display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;min-height:32px\"><input type=\"checkbox\" checked=\"{{ reduced }}\" sc-camel-on-change=\"{{ toggleReduced }}\" style=\"width:18px;height:18px;accent-color:#F2A93B\">Preview reduced motion (static)<\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:var(--radius-lg);height:200px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center\">\n      <span style=\"position:absolute;left:14px;top:12px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#6B625A\">Actual size, 64 → 80px<\u002Fspan>\n      <canvas ref=\"{{ smallRef }}\" style=\"width:176px;height:176px\"><\u002Fcanvas>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02 Stock page mockup\" style=\"display:flex;flex-direction:column;gap:16px\">\n  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap\"><h2 style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-0.02em\">In the wild: noticed on a stock page<\u002Fh2><button sc-camel-on-click=\"{{ replayMock }}\" style=\"height:36px;padding:0 14px;border:1px solid var(--border-2);border-radius:999px;background:var(--secondary-bg);color:var(--text-1);font-family:var(--font-ui);font-weight:600;font-size:13px;cursor:pointer\">Replay<\u002Fbutton><\u002Fdiv>\n  <div style=\"border-radius:var(--radius-xl);overflow:hidden;border:1px solid var(--border-2);box-shadow:var(--shadow-4);background:#FFFFFF\">\n    <div style=\"height:44px;background:#E8EAED;display:flex;align-items:center;gap:12px;padding:0 14px\">\n      <div style=\"display:flex;gap:6px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#C9CCD1\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#C9CCD1\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#C9CCD1\"><\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;max-width:560px;height:28px;border-radius:14px;background:#FFFFFF;display:flex;align-items:center;padding:0 14px;font-family:Arial,sans-serif;font-size:12px;color:#5F6368\">ledgerline.com/quote/NVDA<\u002Fdiv>\n      <img src=\"69b694f8-f116-40fd-a0a8-b6cd67e39358\" width=\"16\" height=\"16\" alt=\"\" style=\"margin-left:auto\">\n    <\u002Fdiv>\n    <div style=\"position:relative;height:640px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#1F2328\">\n      <div style=\"height:52px;border-bottom:1px solid #E6E8EB;display:flex;align-items:center;gap:28px;padding:0 32px;font-size:13px;color:#57606A\"><span style=\"font-weight:800;font-size:17px;color:#1F2328;letter-spacing:-0.02em\">Ledgerline<\u002Fspan><span>Markets<\u002Fspan><span>Stocks<\u002Fspan><span>Earnings<\u002Fspan><span>Watchlist<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:28px 32px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:32px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:13px;color:#57606A\">NASDAQ · NVDA<\u002Fspan><span style=\"font-size:26px;font-weight:700\">NVIDIA Corporation<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font-size:36px;font-weight:700\">$182.46<\u002Fspan><span style=\"font-size:16px;font-weight:700;color:#1A7F37\">+5.61 (+3.17%)<\u002Fspan><span style=\"font-size:12px;color:#57606A\">At close<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:4px;font-size:12px;font-weight:700;color:#57606A\"><span style=\"padding:6px 10px;border-radius:6px;background:#1F2328;color:#FFFFFF\">1D<\u002Fspan><span style=\"padding:6px 10px\">5D<\u002Fspan><span style=\"padding:6px 10px\">1M<\u002Fspan><span style=\"padding:6px 10px\">6M<\u002Fspan><span style=\"padding:6px 10px\">1Y<\u002Fspan><\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 600 240\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:240px;display:block\"><line x1=\"0\" y1=\"60\" x2=\"600\" y2=\"60\" stroke=\"#EEF0F2\"><\u002Fline><line x1=\"0\" y1=\"120\" x2=\"600\" y2=\"120\" stroke=\"#EEF0F2\"><\u002Fline><line x1=\"0\" y1=\"180\" x2=\"600\" y2=\"180\" stroke=\"#EEF0F2\"><\u002Fline><path d=\"{{ chartArea }}\" fill=\"rgba(26,127,55,0.08)\"><\u002Fpath><polyline points=\"{{ chartLine }}\" fill=\"none\" stroke=\"#1A7F37\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpolyline><\u002Fsvg>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px 24px;font-size:13px;border-top:1px solid #E6E8EB;padding-top:16px\">\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#57606A\">Open<\u002Fspan><span>177.10<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#57606A\">High<\u002Fspan><span>183.92<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#57606A\">Low<\u002Fspan><span>176.48<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#57606A\">Mkt cap<\u002Fspan><span>4.45T<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#57606A\">P/E<\u002Fspan><span>51.2<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#57606A\">Volume<\u002Fspan><span>212.4M<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n          <span style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#57606A\">Latest<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px;border-bottom:1px solid #E6E8EB;padding-bottom:14px\"><span style=\"font-size:15px;font-weight:700;line-height:1.35\">NVIDIA tops estimates as data-centre revenue climbs<\u002Fspan><span style=\"font-size:12px;color:#57606A\">2h ago<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;border-bottom:1px solid #E6E8EB;padding-bottom:14px\"><span style=\"font-size:15px;font-weight:700;line-height:1.35\">Chip stocks rally into the close<\u002Fspan><span style=\"font-size:12px;color:#57606A\">4h ago<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;right:100px;bottom:40px;width:250px;padding:14px 16px;border-radius:18px 18px 4px 18px;background:#231C17;color:#F6EEDC;box-shadow:0 2px 6px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;font-family:var(--font-ui);opacity:{{ mockHintOpacity }};transform:translateY({{ mockHintY }});transition:opacity 240ms cubic-bezier(.2,.8,.2,1),transform 240ms cubic-bezier(.2,.8,.2,1)\">\n        <span style=\"font-size:14px;line-height:1.45\">This is about <span style=\"font-family:var(--font-mono);color:#F2A93B\">NVIDIA<\u002Fspan>. Hatch a coin?<\u002Fspan>\n        <div style=\"display:flex;gap:6px\"><button style=\"height:32px;padding:0 14px;border:0;border-radius:999px;background:#F2A93B;color:#120E0B;font-family:var(--font-ui);font-weight:700;font-size:13px\">Hatch it<\u002Fbutton><button style=\"height:32px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#F6EEDC;font-family:var(--font-ui);font-weight:600;font-size:13px\">Not now<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <canvas ref=\"{{ mockRef }}\" style=\"position:absolute;right:-32px;bottom:-32px;width:176px;height:176px\"><\u002Fcanvas>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 Engineer notes\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px\">\n  <div style=\"background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:10px\">\n    <span style=\"font-family:var(--font-display);font-weight:600;font-size:18px\">hatch-orb.js<\u002Fspan>\n    <pre style=\"margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--text-2);white-space:pre-wrap\">const orb = HatchOrb.create(canvas, {\n  onStateChange(state, { badge }) {},\n  onClick() { openSidePanel(); },\n});\norb.setState('noticed');   // idle | noticed | thinking | launched | tracking\norb.setBadge(3);\norb.hatch();               // on-chain hatch: crack + burst, badge −1\norb.destroy();<\u002Fpre>\n  <\u002Fdiv>\n  <div style=\"background:var(--surface-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--text-2);line-height:1.5\">\n    <span style=\"font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--text-1)\">How it works<\u002Fspan>\n    <span>Shapes are silhouettes painted into a 100×100 box (white = Shell, red = Yolk, blue = Ember). 42% of dots are sampled from edges so the outline stays readable at 64px.<\u002Fspan>\n    <span>Morph: dots sorted by angle and paired 1:1, eased in-out over 600–900ms with a left-to-right delay of up to 220ms.<\u002Fspan>\n    <span>328 shape dots + 72 rim dots = 400. One requestAnimationFrame loop, paused when the tab is hidden. With reduced motion on, every state renders as one still frame.<\u002Fspan>\n    <span>The canvas is 176px so the burst can leave the disc. Clicks and hover only count inside the disc radius.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;stageBg&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;}}\">\nclass Component extends DCLogic {\n  state = { orb: 'idle', badge: 0, reduced: false, mockNoticed: false };\n  bigRef = React.createRef();\n  smallRef = React.createRef();\n  mockRef = React.createRef();\n\n  componentDidMount() {\n    this.poll = setInterval(() => {\n      if (window.HatchOrb && this.bigRef.current && this.smallRef.current && this.mockRef.current) {\n        clearInterval(this.poll);\n        this.init();\n      }\n    }, 50);\n  }\n  componentWillUnmount() {\n    clearInterval(this.poll); clearTimeout(this.mockT);\n    [this.big, this.small, this.mock].forEach((o) => o && o.destroy());\n  }\n  init() {\n    const H = window.HatchOrb;\n    this.big = H.create(this.bigRef.current, {\n      size: { radius: 96, hoverRadius: 120, canvas: 440 },\n      onStateChange: (s, info) => this.setState({ orb: s, badge: info.badge }),\n    });\n    this.small = H.create(this.smallRef.current, {});\n    this.mock = H.create(this.mockRef.current, {});\n    this.setState({ reduced: this.big.isReduced() });\n    this.replayMock();\n  }\n  each(fn) { [this.big, this.small].forEach((o) => o && fn(o)); }\n  go(s) { this.each((o) => o.setState(s)); }\n  replayMock() {\n    if (!this.mock) return;\n    clearTimeout(this.mockT);\n    this.mock.setState('idle');\n    this.setState({ mockNoticed: false });\n    this.mockT = setTimeout(() => { this.mock.setState('noticed'); this.mockT = setTimeout(() => this.setState({ mockNoticed: true }), 700); }, 1400);\n  }\n  setBadge(n) { n = Math.max(0, n); this.each((o) => o.setBadge(n)); this.setState({ badge: n }); }\n\n  renderVals() {\n    const s = this.state.orb;\n    const launch = () => { this.setBadge(this.state.badge + 1); this.go('launched'); };\n    const defs = [\n      ['idle', 'Idle', 'Chicken breathes, pecks, twinkles.', () => this.go('idle')],\n      ['noticed', 'Noticed', 'Flows into a Yolk egg, meteor streak, wobble.', () => this.go('noticed')],\n      ['thinking', 'Thinking', 'Egg holds, dots swirl inside.', () => this.go('thinking')],\n      ['launched', 'Launched', 'Cracks, Ember burst, reforms the chicken.', launch],\n      ['tracking', 'Tracking', 'Chicken with a Yolk count badge.', () => { if (this.state.badge < 1) this.setBadge(1); this.go('tracking'); }],\n    ];\n    const stateButtons = defs.map(([id, label, desc, onClick], i) => ({\n      n: i + 1, label, desc, onClick,\n      bg: s === id ? 'var(--surface-3)' : 'transparent',\n      border: s === id ? 'var(--accent)' : 'var(--border-1)',\n    }));\n\n    // deterministic fake intraday chart\n    let seed = 7, v = 120;\n    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);\n    const pts = [];\n    for (let i = 0; i <= 80; i++) { v += (rnd() - 0.42) * 9; v = Math.max(40, Math.min(210, v)); pts.push([i * 7.5, 240 - v]); }\n    const chartLine = pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');\n    const chartArea = 'M0,240 L' + pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + ' L600,240 Z';\n\n    return {\n      bigRef: this.bigRef, smallRef: this.smallRef, mockRef: this.mockRef,\n      stageBg: this.props.stageBg === 'light' ? '#F6EEDC' : '#0B0907',\n      stateButtons,\n      showNoticed: s === 'noticed',\n      showThinking: s === 'thinking',\n      hatchIt: () => this.go('thinking'),\n      launch,\n      toIdle: () => this.go(this.state.badge > 0 ? 'tracking' : 'idle'),\n      badge: this.state.badge,\n      badgeUp: () => this.setBadge(this.state.badge + 1),\n      badgeDown: () => this.setBadge(this.state.badge - 1),\n      hatchOnChain: () => { if (this.state.badge > 0) { this.each((o) => o.hatch()); } },\n      hatchOpacity: this.state.badge > 0 ? 1 : 0.4,\n      reduced: this.state.reduced,\n      toggleReduced: (e) => { const r = e.target.checked; [this.big, this.small, this.mock].forEach((o) => o && o.setReducedMotion(r)); this.setState({ reduced: r }); },\n      replayMock: () => this.replayMock(),\n      mockHintOpacity: this.state.mockNoticed ? 1 : 0,\n      mockHintY: this.state.mockNoticed ? '0px' : '8px',\n      chartLine, chartArea,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
